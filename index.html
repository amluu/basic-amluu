<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ava Luu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Inter:wght@400&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #ffd6e0, transparent 50%),
                    radial-gradient(circle at 70% 80%, #c9e4ff, transparent 50%),
                    #fdfbf7;
        font-family: "Inter", sans-serif;
        color: #1a1a1a;
      }

      main { text-align: center; animation: rise 0.8s ease-out; }

      h1 {
        font-family: "Outfit", sans-serif;
        font-weight: 500;
        font-size: clamp(3.5rem, 13vw, 9rem);
        letter-spacing: -0.04em;
      }


      p { margin-top: 0.5rem; color: #666; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.8rem; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ava Luu</h1>
    </main>
  </body>
</html>
